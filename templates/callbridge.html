<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Call Bridge - Casino Lounge</title>
    <style>
        :root {
            --bg-dark: #0a0c10;
            --panel-bg: rgba(22, 25, 32, 0.95);
            --accent-gold: #f39c12;
            --accent-gold-bright: #f1c40f;
            --btn-green: #27ae60;
            --btn-red: #e74c3c;
        }
        body { background: var(--bg-dark); color: #fff; font-family: sans-serif; text-align: center; padding: 20px; margin: 0; }
        .panel { background: var(--panel-bg); padding: 22px; border-radius: 16px; max-width: 650px; margin: 20px auto; border: 1px solid rgba(243, 156, 18, 0.3); box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .hidden { display: none !important; }
        input, select, button { padding: 12px; margin: 8px 0; width: 100%; border-radius: 10px; border: 1px solid #34495e; background: #0d0f14; color: #fff; font-weight: bold; font-size: 14px; }
        button { background: var(--accent-gold); color: #000; cursor: pointer; border: none; }
        button:hover { filter: brightness(1.15); }
        .card-btn { width: 50px; height: 75px; background: #fff; color: #111; border-radius: 6px; display: inline-flex; flex-direction: column; justify-content: space-between; padding: 4px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .card-btn.red { color: #e74c3c; }
        .hand-container { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-top: 15px; }
    </style>
</head>
<body>

    <!-- STEP 1: CREATE OR JOIN -->
    <div id="action-select-panel" class="panel">
        <h1 style="color: var(--accent-gold);">♠ Call Bridge Lounge ♣</h1>
        <p style="color: #aaa;">4 Players • Permanent Spades Trump • Strict Under-13 Penalties</p>
        <button onclick="showStep('create')">Create Room</button>
        <button onclick="showStep('join')" style="background: var(--btn-green); color:#fff;">Join Room</button>
    </div>

    <!-- STEP 2: CREATE FORM -->
    <div id="create-panel" class="panel hidden">
        <h2>Host Call Bridge Table</h2>
        <input type="text" id="create-code" placeholder="Room Code (e.g. BRIDGE1)">
        <input type="text" id="create-name" placeholder="Your Name" value="Host Admin">
        <button onclick="submitCreate()">Launch Table</button>
    </div>

    <!-- STEP 2: JOIN FORM -->
    <div id="join-panel" class="panel hidden">
        <h2>Join Call Bridge Table</h2>
        <input type="text" id="join-code" placeholder="Enter Room Code">
        <input type="text" id="join-name" placeholder="Your Player Name">
        <button onclick="submitJoin()" style="background: var(--btn-green); color:#fff;">Take Seat</button>
    </div>

    <!-- GAME BOARD -->
    <div id="game-board" class="panel hidden">
        <h2>Room: <span id="lbl-room" style="color: var(--accent-gold-bright);"></span></h2>
        <div id="board-status" style="font-size: 15px; font-weight: bold; margin: 10px 0; color: #2ecc71;">Waiting for players...</div>
        
        <!-- BIDDING CONTROLS -->
        <div id="bidding-box" class="hidden">
            <h3>Place Your Call (1 to 13)</h3>
            <input type="number" id="bid-amount" min="1" max="13" value="3">
            <button onclick="submitBid()">Submit Call</button>
        </div>

        <!-- TRICK BOARD & HAND -->
        <div id="play-box" class="hidden">
            <div id="trick-display" style="min-height: 90px; background: #0d0f14; border-radius: 10px; padding: 10px; margin: 10px 0;">
                <p style="color:#aaa; margin:0; font-size:12px;">Current Trick</p>
            </div>
            <h3>Your Hand (Spades is Trump):</h3>
            <div id="player-hand" class="hand-container"></div>
        </div>

        <div id="score-summary" style="margin-top: 15px; font-size: 13px; text-align: left; background: #0d0f14; padding: 10px; border-radius: 8px;"></div>
    </div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
    const socket = io();
    const urlParams = new URLSearchParams(window.location.search);
    if(urlParams.get('room')) {
        document.getElementById('join-code').value = urlParams.get('room');
        showStep('join');
    }

    function showStep(step) {
        document.getElementById('action-select-panel').classList.add('hidden');
        document.getElementById('create-panel').classList.add('hidden');
        document.getElementById('join-panel').classList.add('hidden');
        if(step === 'create') document.getElementById('create-panel').classList.remove('hidden');
        if(step === 'join') document.getElementById('join-panel').classList.remove('hidden');
    }

    function submitCreate() {
        socket.emit('create_room', { room_id: document.getElementById('create-code').value.toUpperCase(), game_type: 'call_bridge', host_name: document.getElementById('create-name').value });
    }

    function submitJoin() {
        socket.emit('join_room_request', { room_id: document.getElementById('join-code').value.toUpperCase(), player_name: document.getElementById('join-name').value });
    }

    function submitBid() {
        const callVal = parseInt(document.getElementById('bid-amount').value);
        socket.emit('cb_bid', { room_id: document.getElementById('lbl-room').innerText, call: callVal });
    }

    socket.on('room_created', (data) => {
        document.getElementById('create-panel').classList.add('hidden');
        document.getElementById('game-board').classList.remove('hidden');
        document.getElementById('lbl-room').innerText = data.room_id;
    });

    socket.on('join_approved', (data) => {
        document.getElementById('join-panel').classList.add('hidden');
        document.getElementById('game-board').classList.remove('hidden');
        document.getElementById('lbl-room').innerText = data.room_id;
    });

    socket.on('game_state', (state) => {
        document.getElementById('board-status').innerText = `Round: ${state.round_number} | Phase: ${state.phase}`;
        
        if(state.phase === 'BIDDING') {
            document.getElementById('bidding-box').classList.remove('hidden');
            document.getElementById('play-box').classList.add('hidden');
        } else if(state.phase === 'PLAYING') {
            document.getElementById('bidding-box').classList.add('hidden');
            document.getElementById('play-box').classList.remove('hidden');

            const handDiv = document.getElementById('player-hand');
            handDiv.innerHTML = '';
            const me = state.players.find(p => p.name === document.getElementById('create-name').value || p.name === document.getElementById('join-name').value);
            if(me && me.hand) {
                me.hand.forEach(c => {
                    const isRed = ['H', 'D'].includes(c.suit);
                    const suitsMap = { 'S': '♠', 'H': '♥', 'D': '♦', 'C': '♣' };
                    const btn = document.createElement('div');
                    btn.className = `card-btn ${isRed ? 'red' : ''}`;
                    btn.innerHTML = `<div>${c.rank}</div><div style="text-align:center;">${suitsMap[c.suit]}</div><div style="text-align:right;">${c.rank}</div>`;
                    btn.onclick = () => socket.emit('cb_play', { room_id: state.room_id, card: c });
                    handDiv.appendChild(btn);
                });
            }
        }
        document.getElementById('score-summary').innerText = state.last_hand_summary || '';
    });

    socket.on('error', (err) => alert(err.message));
</script>
</body>
</html>
