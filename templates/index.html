<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Texas Hold'em Poker</title>
    <style>
        :root {
            --felt-color: #12542a;
            --table-rim: #2d1810;
            --accent-gold: #f1c40f;
            --card-w: 48px;
            --card-h: 68px;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container { width: 100%; max-width: 1000px; }
        .card-panel { background: #1e1e1e; padding: 15px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .hidden { display: none !important; }

        input, button {
            padding: 10px 14px; margin: 4px; border-radius: 6px;
            border: 1px solid #444; background: #2a2a2a; color: #fff; font-size: 14px;
        }

        button { background: #27ae60; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background: #2ecc71; }
        button:disabled { background: #555 !important; cursor: not-allowed; opacity: 0.5; }
        button.btn-danger { background: #c0392b; }
        button.btn-warning { background: #d35400; }

        .poker-table-container {
            position: relative; width: 100%; height: 520px; margin: 10px 0;
            display: flex; justify-content: center; align-items: center;
        }

        .poker-table {
            position: relative; width: 80%; height: 320px;
            background: radial-gradient(circle, #196f3d 0%, var(--felt-color) 85%);
            border: 14px solid var(--table-rim); border-radius: 180px;
            box-shadow: inset 0 0 25px #000, 0 10px 30px rgba(0,0,0,0.8);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        .pot-badge {
            font-size: 18px; font-weight: bold; color: var(--accent-gold);
            background: rgba(0,0,0,0.8); padding: 6px 16px; border-radius: 16px;
            border: 1px solid var(--accent-gold); margin-bottom: 8px; text-align: center;
        }

        .community-cards { display: flex; gap: 6px; min-height: var(--card-h); }

        .card-graphic {
            width: var(--card-w); height: var(--card-h); background: #ffffff;
            border-radius: 5px; display: inline-flex; flex-direction: column;
            justify-content: space-between; padding: 3px; box-sizing: border-box;
            color: #000; font-weight: bold; font-size: 13px; user-select: none;
        }
        .card-graphic.red { color: #e74c3c; }
        .card-graphic.black { color: #2c3e50; }
        .card-back {
            background: repeating-linear-gradient(135deg, #2980b9, #2980b9 8px, #3498db 8px, #3498db 16px);
            border: 2px solid #fff;
        }

        .seat {
            position: absolute; width: 130px; background: rgba(25, 25, 25, 0.95);
            border: 2px solid #444; border-radius: 8px; padding: 6px;
            text-align: center; font-size: 12px; z-index: 5;
        }
        .seat.is-me { border-color: var(--accent-gold); background: rgba(35, 35, 10, 0.95); z-index: 10; }
        .seat.active-turn { box-shadow: 0 0 18px var(--accent-gold); }

        .seat-0 { bottom: 0px; left: 50%; transform: translateX(-50%); }
        .seat-1 { bottom: 60px; left: 1%; }
        .seat-2 { top: 60px; left: 1%; }
        .seat-3 { top: 0px; left: 50%; transform: translateX(-50%); }
        .seat-4 { top: 60px; right: 1%; }
        .seat-5 { bottom: 60px; right: 1%; }

        .request-card {
            background: #252525; padding: 8px 12px; border-radius: 8px;
            margin: 6px 0; border-left: 4px solid var(--accent-gold);
            display: flex; justify-content: space-between; align-items: center;
        }

        .ledger-table {
            width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; text-align: left;
        }
        .ledger-table th, .ledger-table td {
            padding: 8px; border: 1px solid #444;
        }
        .ledger-table th { background: #333; color: var(--accent-gold); }

        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-box {
            background: #222; padding: 25px; border-radius: 12px; max-width: 550px; width: 92%; text-align: center; border: 2px solid var(--accent-gold);
        }
    </style>
</head>
<body>

<div class="container">
    <!-- LOBBY -->
    <div id="lobby-section" class="card-panel">
        <h2>Texas Hold'em - Game Lobby</h2>
        <div>
            <h3>Create Table (Host Admin)</h3>
            <input type="text" id="host-room-id" placeholder="Room Code (e.g. ROOM1)">
            <input type="text" id="host-name" placeholder="Admin / Player Name" value="Host Admin">
            <div style="margin: 10px 0;">
                <label style="font-size: 14px; cursor: pointer;">
                    <input type="checkbox" id="host-is-playing" onchange="toggleHostBuyin(this.checked)"> Play in game as a player
                </label>
            </div>
            <input type="number" id="host-buyin" class="hidden" placeholder="Host Starting Chips" value="1000">
            <button id="btn-create-room">Create Table</button>
        </div>
        <hr style="border-color: #333; margin: 15px 0;">
        <div>
            <h3>Join Table (Player)</h3>
            <input type="text" id="join-room-id" placeholder="Room Code">
            <input type="text" id="join-name" placeholder="Player Name">
            <input type="number" id="join-buyin" placeholder="Starting Chips" value="1000">
            <button id="btn-join-room">Join Table</button>
        </div>
    </div>

    <!-- GAME SECTION -->
    <div id="game-section" class="card-panel hidden">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2>Room Code: <span id="display-room-id" style="color: var(--accent-gold);"></span> <span id="host-indicator" class="hidden" style="color: #2ecc71; font-size: 14px;">(Host Admin)</span></h2>
            <div>
                <button id="btn-add-cash-req" class="hidden">Request Cash</button>
                <button id="btn-view-last-hand">View Last Hand</button>
                <button id="btn-exit-game" class="btn-danger">Exit Game</button>
            </div>
        </div>

        <!-- HOST CONTROL PANEL -->
        <div id="host-controls" class="card-panel hidden" style="border: 2px solid var(--accent-gold); background: #161616;">
            <h3 style="color: var(--accent-gold); margin-top: 0;">Host Control Panel</h3>
            <button id="btn-start-hand" style="font-size: 15px;">Start Next Hand</button>
            <button id="btn-discontinue-hand" class="btn-warning" style="font-size: 15px;">Discontinue Current Hand</button>
            
            <div style="margin-top: 12px;">
                <h4 style="margin: 5px 0; color: #fff;">Pending Approvals (<span id="request-count">0</span>):</h4>
                <div id="pending-requests-list"></div>
            </div>

            <!-- PLAYER ACCOUNT LEDGER (HOST ONLY) -->
            <div style="margin-top: 15px;">
                <h4 style="margin: 5px 0; color: var(--accent-gold);">Current Players' Account Details (Ledger)</h4>
                <div id="host-ledger-container" style="overflow-x: auto;"></div>
            </div>
        </div>

        <!-- POKER TABLE -->
        <div class="poker-table-container">
            <div class="poker-table">
                <div class="pot-badge">
                    <div>Total Pot: $<span id="pot-amount">0</span></div>
                    <div style="font-size: 12px; color: #aaa; margin-top:2px;">Street: <span id="street-name" style="color:#fff;">PREFLOP</span> | Highest Bet: $<span id="high-bet-amount">0</span></div>
                </div>
                <div class="community-cards" id="community-cards"></div>
            </div>
            <div id="seats-container"></div>
        </div>

        <!-- PLAYER ACTION CONTROLS -->
        <div id="player-action-panel" class="card-panel" style="background: #2a2a2a; text-align: center;">
            <button id="btn-check">Check</button>
            <button id="btn-call">Call $<span id="call-amount-label">0</span></button>
            <button id="btn-fold" class="btn-danger">Fold</button>
            <span style="margin: 0 8px;">|</span>
            <input type="number" id="raise-amount" style="width: 90px;" value="40">
            <button id="btn-raise">Raise / Bet Target</button>
        </div>
    </div>
</div>

<!-- MODAL POPUP -->
<div id="popup-modal" class="modal-overlay hidden">
    <div class="modal-box">
        <h2 id="modal-title" style="color: var(--accent-gold);">Notification</h2>
        <div id="modal-body" style="font-size: 15px; line-height: 1.5; margin: 15px 0;"></div>
        <button id="btn-close-modal">Dismiss</button>
    </div>
</div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
    const socket = io();
    let currentRoom = localStorage.getItem('poker_room_id') || '';
    let sessionId = localStorage.getItem('poker_session_id') || createUUID();
    localStorage.setItem('poker_session_id', sessionId);
    let isHost = false;
    let hostIsPlaying = false;
    let lastHandSummaryText = "No hands played yet.";

    function createUUID() {
        return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
            var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
            return v.toString(16);
        });
    }

    function toggleHostBuyin(checked) {
        document.getElementById('host-buyin').classList.toggle('hidden', !checked);
    }

    // Auto reconnect on refresh
    socket.on('connect', () => {
        if (currentRoom) {
            socket.emit('reconnect_session', { room_id: currentRoom, session_id: sessionId });
        }
    });

    socket.on('session_restored', (data) => {
        if (data.success) {
            currentRoom = data.room_id;
            isHost = data.is_host;
            document.getElementById('lobby-section').classList.add('hidden');
            document.getElementById('game-section').classList.remove('hidden');
            document.getElementById('display-room-id').innerText = currentRoom;

            if (isHost) {
                document.getElementById('host-controls').classList.remove('hidden');
                document.getElementById('host-indicator').classList.remove('hidden');
            } else {
                document.getElementById('btn-add-cash-req').classList.remove('hidden');
            }
        } else {
            localStorage.removeItem('poker_room_id');
        }
    });

    function renderCardGraphic(card) {
        if (!card) return `<div class="card-graphic card-back"></div>`;
        const suitsMap = { 'S': '♠', 'H': '♥', 'D': '♦', 'C': '♣' };
        const symbol = suitsMap[card.suit] || card.suit;
        const isRed = ['♥', '♦', 'H', 'D'].includes(card.suit);

        return `
            <div class="card-graphic ${isRed ? 'red' : 'black'}">
                <div>${card.rank}</div>
                <div style="text-align:center; font-size: 16px;">${symbol}</div>
                <div style="text-align:right;">${card.rank}</div>
            </div>
        `;
    }

    document.getElementById('btn-create-room').addEventListener('click', () => {
        const roomId = document.getElementById('host-room-id').value.trim().toUpperCase();
        const hostName = document.getElementById('host-name').value.trim();
        const isPlaying = document.getElementById('host-is-playing').checked;
        const hostBuyin = parseFloat(document.getElementById('host-buyin').value) || 1000;

        if (!roomId) return alert('Enter room code');
        currentRoom = roomId;
        localStorage.setItem('poker_room_id', currentRoom);
        socket.emit('create_room', {
            room_id: roomId,
            host_name: hostName,
            host_is_playing: isPlaying,
            host_buyin: hostBuyin,
            session_id: sessionId
        });
    });

    document.getElementById('btn-join-room').addEventListener('click', () => {
        const roomId = document.getElementById('join-room-id').value.trim().toUpperCase();
        const playerName = document.getElementById('join-name').value.trim();
        const buyIn = parseFloat(document.getElementById('join-buyin').value) || 1000;
        if (!roomId || !playerName) return alert('Enter Room Code and Player Name');
        currentRoom = roomId;
        localStorage.setItem('poker_room_id', currentRoom);
        socket.emit('join_room_request', { room_id: roomId, player_name: playerName, buy_in: buyIn, session_id: sessionId });
    });

    document.getElementById('btn-start-hand').addEventListener('click', () => {
        socket.emit('start_hand', { room_id: currentRoom });
    });

    document.getElementById('btn-discontinue-hand').addEventListener('click', () => {
        if (confirm("Discontinue current hand?")) {
            socket.emit('discontinue_hand', { room_id: currentRoom });
        }
    });

    document.getElementById('btn-exit-game').addEventListener('click', () => {
        if (isHost) {
            if (confirm("Exiting as Host will close the room for everyone. Are you sure you want to exit and close the game?")) {
                socket.emit('close_room_by_host', { room_id: currentRoom });
            }
        } else {
            if (confirm("Exit game table?")) {
                socket.emit('leave_game', { room_id: currentRoom });
                localStorage.removeItem('poker_room_id');
                location.reload();
            }
        }
    });

    document.getElementById('btn-add-cash-req').addEventListener('click', () => {
        const amt = prompt("Enter cash amount:", "500");
        if (amt && !isNaN(amt)) {
            socket.emit('request_add_cash', { room_id: currentRoom, amount: parseFloat(amt) });
        }
    });

    document.getElementById('btn-view-last-hand').addEventListener('click', () => {
        showModal('Last Hand History', `<pre style="text-align:left; white-space:pre-wrap;">${lastHandSummaryText}</pre>`);
    });

    document.getElementById('btn-check').addEventListener('click', () => sendAction('check'));
    document.getElementById('btn-call').addEventListener('click', () => sendAction('call'));
    document.getElementById('btn-fold').addEventListener('click', () => sendAction('fold'));
    document.getElementById('btn-raise').addEventListener('click', () => {
        const amt = parseFloat(document.getElementById('raise-amount').value) || 0;
        sendAction('raise', amt);
    });

    function sendAction(action, amount = 0) {
        socket.emit('player_action', { room_id: currentRoom, action: action, amount: amount });
    }

    function showModal(title, htmlContent) {
        document.getElementById('modal-title').innerText = title;
        document.getElementById('modal-body').innerHTML = htmlContent;
        document.getElementById('popup-modal').classList.remove('hidden');
    }

    document.getElementById('btn-close-modal').addEventListener('click', () => {
        document.getElementById('popup-modal').classList.add('hidden');
    });

    socket.on('room_created', (data) => {
        isHost = true;
        hostIsPlaying = data.host_is_playing;
        document.getElementById('lobby-section').classList.add('hidden');
        document.getElementById('game-section').classList.remove('hidden');
        document.getElementById('host-controls').classList.remove('hidden');
        document.getElementById('host-indicator').classList.remove('hidden');
        document.getElementById('display-room-id').innerText = data.room_id;
        if (hostIsPlaying) {
            document.getElementById('btn-add-cash-req').classList.remove('hidden');
        }
    });

    socket.on('join_pending', (data) => showModal('Request Sent', `<p>${data.message}</p>`));

    socket.on('join_approved', (data) => {
        document.getElementById('lobby-section').classList.add('hidden');
        document.getElementById('game-section').classList.remove('hidden');
        document.getElementById('btn-add-cash-req').classList.remove('hidden');
        document.getElementById('display-room-id').innerText = data.room_id;
    });

    socket.on('kicked', (data) => {
        alert(data.message);
        localStorage.removeItem('poker_room_id');
        location.reload();
    });

    socket.on('notification', (data) => showModal(data.title, `<p>${data.message}</p>`));

    socket.on('room_closed', (data) => {
        localStorage.removeItem('poker_room_id');
        let ledgerHtml = renderLedgerTable(data.ledger);
        showModal('📢 Game Ended & Room Closed', `
            <p style="color:#e74c3c; font-weight:bold;">${data.message}</p>
            <p style="font-size:13px; color:#aaa;">Please take a screenshot of the final account ledger below for your records:</p>
            ${ledgerHtml}
        `);
        document.getElementById('btn-close-modal').onclick = () => {
            location.reload();
        };
    });

    function renderLedgerTable(ledger) {
        if (!ledger || ledger.length === 0) return '<p>No ledger history.</p>';
        let rows = ledger.map(p => {
            const netColor = p.net_pl >= 0 ? '#2ecc71' : '#e74c3c';
            const sign = p.net_pl >= 0 ? '+' : '';
            return `
                <tr>
                    <td><strong>${p.name}</strong> <span style="font-size:10px; color:#aaa;">(${p.status})</span></td>
                    <td>$${p.initial_buy_in.toFixed(2)}</td>
                    <td>$${p.added_cash.toFixed(2)}</td>
                    <td>$${p.chips.toFixed(2)}</td>
                    <td style="color:${netColor}; font-weight:bold;">${sign}$${p.net_pl.toFixed(2)}</td>
                </tr>
            `;
        }).join('');

        return `
            <table class="ledger-table">
                <thead>
                    <tr>
                        <th>Player</th>
                        <th>Initial</th>
                        <th>Added</th>
                        <th>Current</th>
                        <th>Net P/L</th>
                    </tr>
                </thead>
                <tbody>${rows}</tbody>
            </table>
        `;
    }

    socket.on('game_state', (state) => {
        lastHandSummaryText = state.last_hand_summary || 'No hands completed yet.';
        document.getElementById('pot-amount').innerText = state.pot.toFixed(2);
        document.getElementById('high-bet-amount').innerText = state.highest_bet.toFixed(2);
        document.getElementById('street-name').innerText = state.street;

        if (state.is_host) {
            const listContainer = document.getElementById('pending-requests-list');
            listContainer.innerHTML = '';

            const joins = state.pending_joins || [];
            const cashes = state.pending_add_cash || [];
            
            document.getElementById('request-count').innerText = joins.length + cashes.length;

            if (joins.length === 0 && cashes.length === 0) {
                listContainer.innerHTML = '<p style="color:#aaa; font-size:12px;">No pending requests.</p>';
            } else {
                joins.forEach(p => {
                    const card = document.createElement('div');
                    card.className = 'request-card';
                    card.innerHTML = `<div><strong>Join:</strong> ${p.name} ($${p.buy_in})</div>`;
                    const btn = document.createElement('button');
                    btn.innerText = 'Approve';
                    btn.onclick = () => socket.emit('approve_join', { room_id: currentRoom, sid: p.sid });
                    card.appendChild(btn);
                    listContainer.appendChild(card);
                });

                cashes.forEach(c => {
                    const card = document.createElement('div');
                    card.className = 'request-card';
                    card.innerHTML = `<div><strong>Cash:</strong> ${c.name} (+$${c.amount})</div>`;
                    const btn = document.createElement('button');
                    btn.innerText = 'Approve';
                    btn.onclick = () => socket.emit('approve_add_cash', { room_id: currentRoom, sid: c.sid, amount: c.amount });
                    card.appendChild(btn);
                    listContainer.appendChild(card);
                });
            }

            // Render Host Live Account Ledger
            document.getElementById('host-ledger-container').innerHTML = renderLedgerTable(state.ledger_summary);
        }

        // Render Community Cards
        const ccContainer = document.getElementById('community-cards');
        ccContainer.innerHTML = '';
        for (let i = 0; i < 5; i++) {
            const card = (state.community_cards && state.community_cards[i]) ? state.community_cards[i] : null;
            ccContainer.innerHTML += renderCardGraphic(card);
        }

        // Render Table Seats
        const seatsContainer = document.getElementById('seats-container');
        seatsContainer.innerHTML = '';

        let myCurrentBet = 0;
        let amIPlaying = false;

        state.players.forEach((p, idx) => {
            const isMe = (p.sid === socket.id);
            if (isMe) {
                myCurrentBet = p.current_bet;
                amIPlaying = true;
            }

            const isTurn = (p.sid === state.current_turn_sid);
            
            let cardsHtml = '';
            if (isMe && p.hole_cards && p.hole_cards.length > 0) {
                cardsHtml = p.hole_cards.map(c => renderCardGraphic(c)).join('');
            } else if (state.street === 'SHOWDOWN' && p.hole_cards && p.hole_cards.length > 0) {
                cardsHtml = p.hole_cards.map(c => renderCardGraphic(c)).join('');
            }

            let kickBtnHtml = (state.is_host && !isMe) 
                ? `<button class="btn-danger" style="padding:1px 5px; font-size:10px; margin-top:2px;" onclick="kickPlayer('${p.sid}')">Kick</button>` 
                : '';

            seatsContainer.innerHTML += `
                <div class="seat seat-${idx % 6} ${isMe ? 'is-me' : ''} ${isTurn ? 'active-turn' : ''}">
                    <div><strong>${p.name}</strong> ${p.is_dealer ? '<span style="background:#fff; color:#000; padding:1px 3px; border-radius:50%; font-size:9px;">D</span>' : ''}</div>
                    <div>Chips: $${p.chips.toFixed(2)}</div>
                    <div>Bet: $${p.current_bet.toFixed(2)} ${p.folded ? '<span style="color:#e74c3c;">(Folded)</span>' : ''}</div>
                    ${cardsHtml ? `<div style="display:flex; justify-content:center; gap:2px; margin-top:4px;">${cardsHtml}</div>` : ''}
                    ${kickBtnHtml}
                </div>
            `;
        });

        // Hide action controls if spectator host
        document.getElementById('player-action-panel').classList.toggle('hidden', !amIPlaying);

        const callNeeded = Math.max(0, state.highest_bet - myCurrentBet);
        document.getElementById('call-amount-label').innerText = callNeeded.toFixed(2);

        if (amIPlaying) {
            const myTurn = (socket.id === state.current_turn_sid);
            document.querySelectorAll('#player-action-panel button, #player-action-panel input').forEach(el => {
                el.disabled = !myTurn;
            });
        }
    });

    function kickPlayer(targetSid) {
        if (confirm("Kick player from game?")) {
            socket.emit('kick_player', { room_id: currentRoom, target_sid: targetSid });
        }
    }

    socket.on('error', (err) => showModal('Error', `<p>${err.message}</p>`));
</script>
</body>
</html>
