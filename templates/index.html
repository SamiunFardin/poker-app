<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Texas Hold'em Poker</title>
    <style>
        :root {
            --felt-color: #12542a;
            --table-rim: #2d1810;
            --accent-gold: #f1c40f;
            --card-w: 52px;
            --card-h: 74px;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container { width: 100%; max-width: 1100px; }
        .card-panel { background: #1e1e1e; padding: 20px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .hidden { display: none !important; }

        input, button {
            padding: 10px 14px; margin: 5px; border-radius: 6px;
            border: 1px solid #444; background: #2a2a2a; color: #fff; font-size: 14px;
        }

        button { background: #27ae60; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background: #2ecc71; }
        button:disabled { background: #555 !important; cursor: not-allowed; opacity: 0.5; }
        button.btn-danger { background: #c0392b; }

        .poker-table-container {
            position: relative; width: 100%; height: 500px; margin: 20px 0;
            display: flex; justify-content: center; align-items: center;
        }

        .poker-table {
            position: relative; width: 85%; height: 380px;
            background: radial-gradient(circle, #196f3d 0%, var(--felt-color) 85%);
            border: 18px solid var(--table-rim); border-radius: 200px;
            box-shadow: inset 0 0 25px #000, 0 10px 30px rgba(0,0,0,0.8);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        .pot-badge {
            font-size: 22px; font-weight: bold; color: var(--accent-gold);
            background: rgba(0,0,0,0.75); padding: 8px 20px; border-radius: 20px;
            border: 1px solid var(--accent-gold); margin-bottom: 15px;
        }

        .community-cards { display: flex; gap: 8px; min-height: var(--card-h); }

        .card-graphic {
            width: var(--card-w); height: var(--card-h); background: #ffffff;
            border-radius: 6px; display: inline-flex; flex-direction: column;
            justify-content: space-between; padding: 4px; box-sizing: border-box;
            color: #000; font-weight: bold; font-size: 14px; user-select: none;
        }
        .card-graphic.red { color: #e74c3c; }
        .card-graphic.black { color: #2c3e50; }
        .card-back {
            background: repeating-linear-gradient(135deg, #2980b9, #2980b9 8px, #3498db 8px, #3498db 16px);
            border: 2px solid #fff;
        }

        .seat {
            position: absolute; width: 130px; background: rgba(25, 25, 25, 0.95);
            border: 2px solid #444; border-radius: 10px; padding: 10px;
            text-align: center; font-size: 13px;
        }
        .seat.active-turn { border-color: var(--accent-gold); box-shadow: 0 0 18px var(--accent-gold); }

        .seat-0 { bottom: -20px; left: 50%; transform: translateX(-50%); }
        .seat-1 { bottom: 30px; left: 3%; }
        .seat-2 { top: 30px; left: 3%; }
        .seat-3 { top: -20px; left: 50%; transform: translateX(-50%); }
        .seat-4 { top: 30px; right: 3%; }
        .seat-5 { bottom: 30px; right: 3%; }

        .request-item {
            display: flex; justify-content: space-between; align-items: center;
            background: #2a2a2a; padding: 8px 12px; border-radius: 6px; margin: 6px 0;
            border: 1px solid var(--accent-gold);
        }

        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-box {
            background: #222; padding: 25px; border-radius: 12px; max-width: 500px; width: 90%; text-align: center; border: 2px solid var(--accent-gold);
        }
    </style>
</head>
<body>

<div class="container">
    <!-- LOBBY -->
    <div id="lobby-section" class="card-panel">
        <h2>Texas Hold'em - Game Lobby</h2>
        <div>
            <h3>Create Table (Host Admin)</h3>
            <input type="text" id="host-room-id" placeholder="Room Code (e.g. ROOM1)">
            <input type="text" id="host-name" placeholder="Admin Name" value="Host Admin">
            <button id="btn-create-room">Create Table</button>
        </div>
        <hr style="border-color: #333; margin: 15px 0;">
        <div>
            <h3>Join Table (Player)</h3>
            <input type="text" id="join-room-id" placeholder="Room Code">
            <input type="text" id="join-name" placeholder="Player Name">
            <input type="number" id="join-buyin" placeholder="Starting Chips" value="1000">
            <button id="btn-join-room">Join Table</button>
        </div>
    </div>

    <!-- GAME SECTION -->
    <div id="game-section" class="card-panel hidden">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2>Room: <span id="display-room-id"></span> <span id="host-indicator" class="hidden" style="color: var(--accent-gold); font-size: 14px;">(Host Admin)</span></h2>
            <div>
                <button id="btn-add-cash-req" class="hidden">Request Add Cash</button>
                <button id="btn-view-last-hand">View Last Hand</button>
            </div>
        </div>

        <!-- HOST CONTROL BOX -->
        <div id="host-controls" class="card-panel hidden" style="border: 2px dashed var(--accent-gold); background: #181818;">
            <h3 style="color: var(--accent-gold); margin-top:0;">Host Management Panel</h3>
            <button id="btn-start-hand" style="font-size: 16px; padding: 12px 20px;">Start Next Hand</button>
            <div id="pending-requests-section" style="margin-top: 15px;">
                <h4 style="margin: 5px 0;">Pending Requests:</h4>
                <div id="pending-requests-list"></div>
            </div>
        </div>

        <!-- POKER TABLE -->
        <div class="poker-table-container">
            <div class="poker-table">
                <div class="pot-badge">Total Pot: $<span id="pot-amount">0</span></div>
                <div class="community-cards" id="community-cards"></div>
            </div>
            <div id="seats-container"></div>
        </div>

        <!-- PLAYER ACTION CONTROLS -->
        <div id="player-action-panel" class="card-panel" style="background: #2a2a2a; text-align: center;">
            <button id="btn-check">Check</button>
            <button id="btn-call">Call</button>
            <button id="btn-fold" class="btn-danger">Fold</button>
            <span style="margin: 0 10px;">|</span>
            <input type="number" id="raise-amount" style="width: 100px;" value="20">
            <button id="btn-raise">Raise / Bet</button>
        </div>
    </div>
</div>

<!-- MODAL -->
<div id="popup-modal" class="modal-overlay hidden">
    <div class="modal-box">
        <h2 id="modal-title" style="color: var(--accent-gold);">Notification</h2>
        <p id="modal-body" style="font-size: 16px; line-height: 1.5; white-space: pre-line;"></p>
        <button id="btn-close-modal">Dismiss</button>
    </div>
</div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
    const socket = io();
    let currentRoom = '';
    let isHost = false;
    let lastHandSummaryText = "No hands played yet.";

    function renderCardGraphic(card) {
        if (!card) return `<div class="card-graphic card-back"></div>`;
        const suitsMap = { 'S': '♠', 'H': '♥', 'D': '♦', 'C': '♣' };
        const symbol = suitsMap[card.suit] || card.suit;
        const isRed = ['♥', '♦', 'H', 'D'].includes(card.suit);

        return `
            <div class="card-graphic ${isRed ? 'red' : 'black'}">
                <div>${card.rank}</div>
                <div style="text-align:center; font-size: 18px;">${symbol}</div>
                <div style="text-align:right;">${card.rank}</div>
            </div>
        `;
    }

    document.getElementById('btn-create-room').addEventListener('click', () => {
        const roomId = document.getElementById('host-room-id').value.trim().toUpperCase();
        const hostName = document.getElementById('host-name').value.trim();
        if (!roomId) return alert('Enter room code');
        currentRoom = roomId;
        socket.emit('create_room', { room_id: roomId, host_name: hostName });
    });

    document.getElementById('btn-join-room').addEventListener('click', () => {
        const roomId = document.getElementById('join-room-id').value.trim().toUpperCase();
        const playerName = document.getElementById('join-name').value.trim();
        const buyIn = parseFloat(document.getElementById('join-buyin').value) || 1000;
        if (!roomId || !playerName) return alert('Enter Room Code and Player Name');
        currentRoom = roomId;
        socket.emit('join_room_request', { room_id: roomId, player_name: playerName, buy_in: buyIn });
    });

    document.getElementById('btn-start-hand').addEventListener('click', () => {
        socket.emit('start_hand', { room_id: currentRoom });
    });

    document.getElementById('btn-add-cash-req').addEventListener('click', () => {
        const amt = prompt("Enter cash amount to request:", "500");
        if (amt && !isNaN(amt)) {
            socket.emit('request_add_cash', { room_id: currentRoom, amount: parseFloat(amt) });
        }
    });

    document.getElementById('btn-view-last-hand').addEventListener('click', () => {
        showModal('Last Hand History', lastHandSummaryText);
    });

    document.getElementById('btn-check').addEventListener('click', () => sendAction('check'));
    document.getElementById('btn-call').addEventListener('click', () => sendAction('call'));
    document.getElementById('btn-fold').addEventListener('click', () => sendAction('fold'));
    document.getElementById('btn-raise').addEventListener('click', () => {
        const amt = parseFloat(document.getElementById('raise-amount').value) || 0;
        sendAction('raise', amt);
    });

    function sendAction(action, amount = 0) {
        socket.emit('player_action', { room_id: currentRoom, action: action, amount: amount });
    }

    function showModal(title, text) {
        document.getElementById('modal-title').innerText = title;
        document.getElementById('modal-body').innerText = text;
        document.getElementById('popup-modal').classList.remove('hidden');
    }

    document.getElementById('btn-close-modal').addEventListener('click', () => {
        document.getElementById('popup-modal').classList.add('hidden');
    });

    // SOCKET LISTENERS
    socket.on('room_created', (data) => {
        isHost = true;
        document.getElementById('lobby-section').classList.add('hidden');
        document.getElementById('game-section').classList.remove('hidden');
        document.getElementById('host-controls').classList.remove('hidden');
        document.getElementById('host-indicator').classList.remove('hidden');
        document.getElementById('player-action-panel').classList.add('hidden');
        document.getElementById('display-room-id').innerText = data.room_id;
    });

    socket.on('join_pending', (data) => showModal('Request Sent', data.message));

    socket.on('join_approved', (data) => {
        document.getElementById('lobby-section').classList.add('hidden');
        document.getElementById('game-section').classList.remove('hidden');
        document.getElementById('btn-add-cash-req').classList.remove('hidden');
        document.getElementById('display-room-id').innerText = data.room_id;
    });

    socket.on('notification', (data) => showModal(data.title, data.message));

    socket.on('game_state', (state) => {
        lastHandSummaryText = state.last_hand_summary || 'No hands completed yet.';
        document.getElementById('pot-amount').innerText = state.pot;

        // Render Requests explicitly for Host
        if (state.is_host) {
            const listContainer = document.getElementById('pending-requests-list');
            listContainer.innerHTML = '';
            let hasRequests = false;

            if (state.pending_joins && state.pending_joins.length > 0) {
                hasRequests = true;
                state.pending_joins.forEach(p => {
                    const div = document.createElement('div');
                    div.className = 'request-item';
                    div.innerHTML = `<span><strong>Join Request:</strong> ${p.name} ($${p.buy_in})</span>`;

                    const btn = document.createElement('button');
                    btn.innerText = 'Approve Join';
                    btn.onclick = () => socket.emit('approve_join', { room_id: currentRoom, sid: p.sid });

                    div.appendChild(btn);
                    listContainer.appendChild(div);
                });
            }

            if (state.pending_add_cash && state.pending_add_cash.length > 0) {
                hasRequests = true;
                state.pending_add_cash.forEach(c => {
                    const div = document.createElement('div');
                    div.className = 'request-item';
                    div.innerHTML = `<span><strong>Cash Request:</strong> ${c.name} (+$${c.amount})</span>`;

                    const btn = document.createElement('button');
                    btn.innerText = 'Approve Cash';
                    btn.onclick = () => socket.emit('approve_add_cash', { room_id: currentRoom, sid: c.sid, amount: c.amount });

                    div.appendChild(btn);
                    listContainer.appendChild(div);
                });
            }

            if (!hasRequests) {
                listContainer.innerHTML = '<p style="color:#aaa; font-size:13px; margin:5px 0;">No pending requests.</p>';
            }
        }

        // Render Community Cards
        const ccContainer = document.getElementById('community-cards');
        ccContainer.innerHTML = (state.community_cards && state.community_cards.length > 0)
            ? state.community_cards.map(c => renderCardGraphic(c)).join('')
            : renderCardGraphic(null) + renderCardGraphic(null) + renderCardGraphic(null);

        // Render Table Seats
        const seatsContainer = document.getElementById('seats-container');
        seatsContainer.innerHTML = '';

        state.players.forEach((p, idx) => {
            const isTurn = (p.sid === state.current_turn_sid);
            const cardsHtml = (p.hole_cards && p.hole_cards.length > 0)
                ? p.hole_cards.map(c => renderCardGraphic(c)).join('')
                : (state.in_progress ? renderCardGraphic(null) + renderCardGraphic(null) : '');

            seatsContainer.innerHTML += `
                <div class="seat seat-${idx % 6} ${isTurn ? 'active-turn' : ''}">
                    <div><strong>${p.name}</strong> ${p.is_dealer ? '<span class="dealer-chip">D</span>' : ''}</div>
                    <div>Chips: $${p.chips}</div>
                    <div>Bet: $${p.current_bet} ${p.folded ? '<span style="color:#e74c3c;">(Folded)</span>' : ''}</div>
                    <div style="display:flex; justify-content:center; gap:4px; margin-top:5px;">${cardsHtml}</div>
                </div>
            `;
        });

        // Action controls enabled only during player's turn
        if (!isHost) {
            const myTurn = (socket.id === state.current_turn_sid);
            document.querySelectorAll('#player-action-panel button, #player-action-panel input').forEach(el => {
                el.disabled = !myTurn;
            });
        }
    });

    socket.on('error', (err) => showModal('Error', err.message));
</script>
</body>
</html>
