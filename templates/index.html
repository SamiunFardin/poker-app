<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poker Game</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #1b2838; color: white; }
        .card { background-color: #2a475e; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        input, button { padding: 10px; margin: 5px 0; border-radius: 4px; border: none; }
        button { background-color: #66c0f4; color: black; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #417a9b; color: white; }
        .hidden { display: none; }
        .poker-card { display: inline-block; padding: 8px 12px; background: white; color: black; font-weight: bold; border-radius: 4px; margin-right: 5px; }
    </style>
</head>
<body>

    <h1>Texas Hold'em Poker</h1>

    <!-- LOBBY SECTION -->
    <div id="lobby-section" class="card">
        <h2>Join or Host Game</h2>
        <div>
            <h3>Host Room</h3>
            <input type="text" id="host-room-id" placeholder="Room Code (e.g. PKR1)">
            <input type="text" id="host-name" placeholder="Your Name" value="Host">
            <button id="btn-create-room">Create Room (Host)</button>
        </div>
        <hr>
        <div>
            <h3>Join Room</h3>
            <input type="text" id="join-room-id" placeholder="Room Code">
            <input type="text" id="join-name" placeholder="Your Name">
            <input type="number" id="join-buyin" placeholder="Buy-in Chips" value="1000">
            <button id="btn-join-room">Join Room (Player)</button>
        </div>
    </div>

    <!-- GAME SECTION -->
    <div id="game-section" class="card hidden">
        <h2>Room: <span id="display-room-id"></span></h2>
        
        <!-- HOST CONTROLS -->
        <div id="host-controls" class="hidden">
            <h3>Host Controls</h3>
            <button id="btn-start-hand">Start Hand</button>
            <div id="pending-requests"></div>
        </div>

        <!-- TABLE STATE -->
        <h3>Community Cards: <span id="community-cards">None</span></h3>
        <h4>Total Pot: $<span id="pot-amount">0</span> | Current Street: <span id="street-name">-</span></h4>

        <!-- PLAYER HOLE CARDS -->
        <div>
            <h3>Your Cards:</h3>
            <div id="my-cards"></div>
        </div>

        <!-- GAME ACTIONS -->
        <div id="action-controls" style="margin-top: 15px;">
            <h3>Actions</h3>
            <button id="btn-check">Check</button>
            <button id="btn-call">Call</button>
            <button id="btn-fold">Fold</button>
            <br>
            <input type="number" id="raise-amount" placeholder="Raise Amount" value="20">
            <button id="btn-raise">Raise</button>
        </div>

        <!-- PLAYER LIST -->
        <h3>Players at Table:</h3>
        <ul id="player-list"></ul>
    </div>

    <!-- Socket.IO Client Library -->
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script>
        const socket = io();
        let currentRoom = '';
        let isHost = false;

        // --- BUTTON EVENT LISTENERS ---
        document.getElementById('btn-create-room').addEventListener('click', () => {
            const roomId = document.getElementById('host-room-id').value.trim();
            const hostName = document.getElementById('host-name').value.trim();
            if (!roomId) return alert('Enter a room code');
            
            currentRoom = roomId;
            socket.emit('create_room', { room_id: roomId, host_name: hostName });
        });

        document.getElementById('btn-join-room').addEventListener('click', () => {
            const roomId = document.getElementById('join-room-id').value.trim();
            const playerName = document.getElementById('join-name').value.trim();
            const buyIn = parseFloat(document.getElementById('join-buyin').value) || 1000;
            if (!roomId || !playerName) return alert('Enter Room ID and Name');

            currentRoom = roomId;
            socket.emit('join_room_request', { room_id: roomId, player_name: playerName, buy_in: buyIn });
        });

        document.getElementById('btn-start-hand').addEventListener('click', () => {
            socket.emit('start_hand', { room_id: currentRoom });
        });

        document.getElementById('btn-check').addEventListener('click', () => sendAction('check'));
        document.getElementById('btn-call').addEventListener('click', () => sendAction('call'));
        document.getElementById('btn-fold').addEventListener('click', () => sendAction('fold'));
        document.getElementById('btn-raise').addEventListener('click', () => {
            const amt = parseFloat(document.getElementById('raise-amount').value) || 0;
            sendAction('raise', amt);
        });

        function sendAction(actionType, amount = 0) {
            socket.emit('player_action', { room_id: currentRoom, action: actionType, amount: amount });
        }

        // --- SOCKET LISTENERS ---
        socket.on('room_created', (data) => {
            isHost = true;
            document.getElementById('lobby-section').classList.add('hidden');
            document.getElementById('game-section').classList.remove('hidden');
            document.getElementById('host-controls').classList.remove('hidden');
            document.getElementById('display-room-id').innerText = data.room_id;
        });

        socket.on('join_pending', (data) => {
            alert(data.message);
        });

        socket.on('join_approved', (data) => {
            document.getElementById('lobby-section').classList.add('hidden');
            document.getElementById('game-section').classList.remove('hidden');
            document.getElementById('display-room-id').innerText = data.room_id;
        });

        socket.on('pending_requests_update', (data) => {
            const container = document.getElementById('pending-requests');
            container.innerHTML = '';
            data.pending_joins.forEach(p => {
                const btn = document.createElement('button');
                btn.innerText = `Approve ${p.name} ($${p.buy_in})`;
                btn.onclick = () => socket.emit('approve_join', { room_id: currentRoom, sid: p.sid });
                container.appendChild(btn);
            });
        });

        socket.on('game_state', (state) => {
            document.getElementById('pot-amount').innerText = state.pot;
            document.getElementById('street-name').innerText = state.street;

            // Render Community Cards
            const ccContainer = document.getElementById('community-cards');
            ccContainer.innerHTML = state.community_cards.map(c => `<span class="poker-card">${c.rank}${c.suit}</span>`).join(' ') || 'None';

            // Render Player List
            const pList = document.getElementById('player-list');
            pList.innerHTML = '';
            state.players.forEach(p => {
                const isTurn = (p.sid === state.current_turn_sid) ? ' <b>(Turn)</b>' : '';
                const cards = p.hole_cards.map(c => `<span class="poker-card">${c.rank}${c.suit}</span>`).join(' ');
                pList.innerHTML += `<li>${p.name}: $${p.chips} | Bet: $${p.current_bet} ${isTurn} ${cards}</li>`;
            });

            // Render My Cards
            const myPlayer = state.players.find(p => p.sid === socket.id);
            if (myPlayer && myPlayer.hole_cards) {
                document.getElementById('my-cards').innerHTML = myPlayer.hole_cards.map(c => `<span class="poker-card">${c.rank}${c.suit}</span>`).join(' ');
            }
        });

        socket.on('error', (err) => alert(err.message));
    </script>
</body>
</html>
