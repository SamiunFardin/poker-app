<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casino Lounge - Select Game</title>
    <style>
        body { background: #0a0c10; color: #fff; font-family: sans-serif; text-align: center; padding: 30px; }
        .game-grid { display: flex; justify-content: center; gap: 20px; margin-top: 40px; flex-wrap: wrap; }
        .game-card { background: #161920; border: 2px solid #f39c12; border-radius: 14px; padding: 25px; width: 280px; cursor: pointer; transition: transform 0.2s; }
        .game-card:hover { transform: translateY(-5px); background: #1f2430; }
        h1 { color: #f39c12; }
    </style>
</head>
<body>
    <h1>♠ Multi-Game Casino Lounge ♣</h1>
    <p>Choose your game to enter the table:</p>

    <div class="game-grid">
        <div class="game-card" onclick="selectGame('texas_holdem')">
            <h2>Texas Hold'em</h2>
            <p>Classic High-Stakes Poker</p>
        </div>
        <div class="game-card" onclick="selectGame('call_bridge')">
            <h2>Call Bridge</h2>
            <p>4 Players, Spades Trump</p>
        </div>
        <div class="game-card" onclick="selectGame('twenty_nine')">
            <h2>29 Card Game</h2>
            <p>Team Trick-Taking Battle</p>
        </div>
    </div>

<script>
    // Direct QR Code / Invite Link Handler
    const urlParams = new URLSearchParams(window.location.search);
    const inviteRoom = urlParams.get('room');
    const inviteGame = urlParams.get('game');
    if (inviteRoom && inviteGame) {
        window.location.href = `/game/${inviteGame}?room=${inviteRoom}`;
    }

    function selectGame(gameType) {
        window.location.href = `/game/${gameType}`;
    }
</script>
</body>
</html>
