<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>29 Card Game - Casino Lounge</title>
    <style>
        :root {
            --bg-dark: #0a0c10;
            --panel-bg: rgba(22, 25, 32, 0.95);
            --accent-gold: #f39c12;
            --accent-gold-bright: #f1c40f;
            --btn-green: #27ae60;
        }
        body { background: var(--bg-dark); color: #fff; font-family: sans-serif; text-align: center; padding: 20px; margin: 0; }
        .panel { background: var(--panel-bg); padding: 22px; border-radius: 16px; max-width: 650px; margin: 20px auto; border: 1px solid rgba(243, 156, 18, 0.3); box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .hidden { display: none !important; }
        input, select, button { padding: 12px; margin: 8px 0; width: 100%; border-radius: 10px; border: 1px solid #34495e; background: #0d0f14; color: #fff; font-weight: bold; font-size: 14px; }
        button { background: var(--accent-gold); color: #000; cursor: pointer; border: none; }
        button:hover { filter: brightness(1.15); }
    </style>
</head>
<body>

    <!-- STEP 1: CREATE OR JOIN -->
    <div id="action-select-panel" class="panel">
        <h1 style="color: var(--accent-gold);">♠ 29 Card Game Lounge ♣</h1>
        <p style="color: #aaa;">32-Card Deck • 2 Fixed Teams • 7th Card Trump Void Rules</p>
        <button onclick="showStep('create')">Create Room</button>
        <button onclick="showStep('join')" style="background: var(--btn-green); color:#fff;">Join Room</button>
    </div>

    <!-- STEP 2: CREATE FORM -->
    <div id="create-panel" class="panel hidden">
        <h2>Host 29 Card Game Table</h2>
        <input type="text" id="create-code" placeholder="Room Code (e.g. TABLE29)">
        <input type="text" id="create-name" placeholder="Your Name" value="Host Admin">
        <button onclick="submitCreate()">Launch Table</button>
    </div>

    <!-- STEP 2: JOIN FORM -->
    <div id="join-panel" class="panel hidden">
        <h2>Join 29 Card Game Table</h2>
        <input type="text" id="join-code" placeholder="Enter Room Code">
        <input type="text" id="join-name" placeholder="Your Player Name">
        <button onclick="submitJoin()" style="background: var(--btn-green); color:#fff;">Take Seat</button>
    </div>

    <!-- GAME BOARD -->
    <div id="game-board" class="panel hidden">
        <h2>Room: <span id="lbl-room" style="color: var(--accent-gold-bright);"></span></h2>
        <div id="board-status" style="font-size: 15px; font-weight: bold; margin: 10px 0; color: #2ecc71;">Waiting for 4 players...</div>
        <div id="score-summary" style="margin-top: 15px; font-size: 14px; background: #0d0f14; padding: 12px; border-radius: 8px;"></div>
    </div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
    const socket = io();
    const urlParams = new URLSearchParams(window.location.search);
    if(urlParams.get('room')) {
        document.getElementById('join-code').value = urlParams.get('room');
        showStep('join');
    }

    function showStep(step) {
        document.getElementById('action-select-panel').classList.add('hidden');
        document.getElementById('create-panel').classList.add('hidden');
        document.getElementById('join-panel').classList.add('hidden');
        if(step === 'create') document.getElementById('create-panel').classList.remove('hidden');
        if(step === 'join') document.getElementById('join-panel').classList.remove('hidden');
    }

    function submitCreate() {
        socket.emit('create_room', { room_id: document.getElementById('create-code').value.toUpperCase(), game_type: 'twenty_nine', host_name: document.getElementById('create-name').value });
    }

    function submitJoin() {
        socket.emit('join_room_request', { room_id: document.getElementById('join-code').value.toUpperCase(), player_name: document.getElementById('join-name').value });
    }

    socket.on('room_created', (data) => {
        document.getElementById('create-panel').classList.add('hidden');
        document.getElementById('game-board').classList.remove('hidden');
        document.getElementById('lbl-room').innerText = data.room_id;
    });

    socket.on('join_approved', (data) => {
        document.getElementById('join-panel').classList.add('hidden');
        document.getElementById('game-board').classList.remove('hidden');
        document.getElementById('lbl-room').innerText = data.room_id;
    });

    socket.on('game_state', (state) => {
        document.getElementById('board-status').innerText = `Phase: ${state.phase} | Highest Bid: ${state.highest_bid}`;
        document.getElementById('score-summary').innerText = `Team 1 Score: ${state.team_scores[1]} | Team 2 Score: ${state.team_scores[2]}\n${state.last_hand_summary || ''}`;
    });

    socket.on('error', (err) => alert(err.message));
</script>
</body>
</html>
