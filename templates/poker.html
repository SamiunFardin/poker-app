<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Texas Hold'em Lounge</title>
    <style>
        body { background: #0a0c10; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; }
        .panel { background: #161920; padding: 20px; border-radius: 12px; max-width: 500px; margin: auto; border: 1px solid #f39c12; }
        .hidden { display: none !important; }
        input, button { padding: 10px; margin: 8px 0; width: 100%; border-radius: 8px; border: none; font-weight: bold; }
        button { background: #f39c12; cursor: pointer; }
    </style>
</head>
<body>
    <div id="action-select-panel" class="panel">
        <h2>Texas Hold'em Table</h2>
        <button onclick="showStep('create')">Create Room</button>
        <button onclick="showStep('join')" style="background:#27ae60; color:#fff;">Join Room</button>
    </div>

    <div id="create-panel" class="panel hidden">
        <h3>Create Poker Room</h3>
        <input type="text" id="create-code" placeholder="Room Code (e.g. VIP1)">
        <input type="text" id="create-name" placeholder="Host Name" value="Host Admin">
        <button onclick="submitCreate()">Launch Table</button>
    </div>

    <div id="join-panel" class="panel hidden">
        <h3>Join Poker Room</h3>
        <input type="text" id="join-code" placeholder="Enter Room Code">
        <input type="text" id="join-name" placeholder="Your Name">
        <button onclick="submitJoin()" style="background:#27ae60; color:#fff;">Enter Table</button>
    </div>

    <div id="game-board" class="panel hidden">
        <h2>Room: <span id="lbl-room"></span></h2>
        <p id="board-status">Waiting to start...</p>
        <div id="host-approval-box"></div>
    </div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
    const socket = io();
    const urlParams = new URLSearchParams(window.location.search);
    if(urlParams.get('room')) {
        document.getElementById('join-code').value = urlParams.get('room');
        showStep('join');
    }

    function showStep(step) {
        document.getElementById('action-select-panel').classList.add('hidden');
        document.getElementById('create-panel').classList.add('hidden');
        document.getElementById('join-panel').classList.add('hidden');
        if(step === 'create') document.getElementById('create-panel').classList.remove('hidden');
        if(step === 'join') document.getElementById('join-panel').classList.remove('hidden');
    }

    function submitCreate() {
        const code = document.getElementById('create-code').value.toUpperCase();
        const name = document.getElementById('create-name').value;
        socket.emit('create_room', { room_id: code, game_type: 'texas_holdem', host_name: name });
    }

    function submitJoin() {
        const code = document.getElementById('join-code').value.toUpperCase();
        const name = document.getElementById('join-name').value;
        socket.emit('join_room_request', { room_id: code, player_name: name });
    }

    socket.on('room_created', (data) => {
        document.getElementById('create-panel').classList.add('hidden');
        document.getElementById('game-board').classList.remove('hidden');
        document.getElementById('lbl-room').innerText = data.room_id;
    });

    socket.on('join_approved', (data) => {
        document.getElementById('join-panel').classList.add('hidden');
        document.getElementById('game-board').classList.remove('hidden');
        document.getElementById('lbl-room').innerText = data.room_id;
    });

    socket.on('game_state', (state) => {
        document.getElementById('board-status').innerText = `Pot: $${state.pot || 0} | Street: ${state.street || 'PREFLOP'}`;
        if(state.is_host && state.pending_joins?.length > 0) {
            let box = document.getElementById('host-approval-box');
            box.innerHTML = '<h4>Pending Join Requests:</h4>';
            state.pending_joins.forEach(p => {
                box.innerHTML += `<div>${p.name} <button onclick="socket.emit('approve_join', {room_id:'${state.room_id}', sid:'${p.sid}'})">Approve</button> <button onclick="socket.emit('reject_join', {room_id:'${state.room_id}', sid:'${p.sid}'})" style="background:red; color:#fff;">Reject</button></div>`;
            });
        }
    });

    socket.on('kicked', (data) => { alert(data.message); location.reload(); });
</script>
</body>
</html>
